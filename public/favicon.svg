    <rect x="18.06" y="56.5" width="21.94" height="11" />
    <polygon points="34.5,14.6 34.5,12 45.5,12 83.5,88 71.2,88" />
    <rect x="72.5" y="12" width="11" height="76" />
  </g>
  <rect class="cursor" x="34.5" y="12" width="11" height="76" />
</svg>
